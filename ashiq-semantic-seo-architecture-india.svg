<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Ashiq — Yoonverse Semantic SEO Architecture, Knowledge Graph Triples &amp; Organic Search Telemetry (India)</title>
  <desc id="svgDesc">Visual semantic architecture diagram showing how Ashiq at Yoonverse (yoonverse.in, India) maps Subject-Predicate-Object semantic triples, Topical Authority clusters, and Google Search Console telemetry to earn #1 organic search rankings.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdf9"/>
      <stop offset="100%" stop-color="#f4ece0"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0532a" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#c0532a" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1d1b18" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="440" rx="20" fill="url(#bgGrad)" stroke="#e2d8c8" stroke-width="2"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#e2d8c8" stroke-width="0.7" opacity="0.55">
    <line x1="0" y1="88" x2="800" y2="88"/>
    <line x1="0" y1="176" x2="800" y2="176"/>
    <line x1="0" y1="264" x2="800" y2="264"/>
    <line x1="0" y1="352" x2="800" y2="352"/>
    <line x1="160" y1="0" x2="160" y2="440"/>
    <line x1="320" y1="0" x2="320" y2="440"/>
    <line x1="480" y1="0" x2="480" y2="440"/>
    <line x1="640" y1="0" x2="640" y2="440"/>
  </g>

  <!-- Top Telemetry Header Bar -->
  <rect x="24" y="20" width="752" height="46" rx="12" fill="#1d1b18"/>
  <circle cx="48" cy="43" r="6" fill="#c0532a"/>
  <circle cx="66" cy="43" r="6" fill="#e5a93c"/>
  <circle cx="84" cy="43" r="6" fill="#4f5d3f"/>
  <text x="110" y="48" fill="#f6f1e8" font-family="monospace" font-size="13" font-weight="600" letter-spacing="1">ENTITY: ASHIQ (YOONVERSE.IN) · REGION: INDIA (IN) · SEMANTIC GRAPH v4.0</text>
  <rect x="650" y="30" width="112" height="26" rx="13" fill="#4f5d3f"/>
  <text x="706" y="47" fill="#fffdf9" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">CWV: 99 / 100</text>

  <!-- Left Card: Organic Search Telemetry & GSC Curve -->
  <g filter="url(#cardShadow)">
    <rect x="24" y="84" width="356" height="332" rx="16" fill="#fffdf9" stroke="#e2d8c8" stroke-width="1.5"/>
  </g>
  <text x="48" y="116" fill="#4f5d3f" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.5">GOOGLE SEARCH CONSOLE TELEMETRY</text>
  <text x="48" y="152" fill="#1d1b18" font-family="Georgia, serif" font-size="30" font-weight="700">+318% Organic Clicks</text>
  <text x="48" y="174" fill="#7d766b" font-family="sans-serif" font-size="13">Intent-matched topical clusters · Zero paid ad spend</text>

  <!-- Growth Area Chart -->
  <path d="M48,310 L95,302 L142,286 L189,292 L236,248 L283,214 L330,175 L356,148 L356,325 L48,325 Z" fill="url(#chartFill)"/>
  <path d="M48,310 L95,302 L142,286 L189,292 L236,248 L283,214 L330,175 L356,148" fill="none" stroke="#c0532a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="236" cy="248" r="5" fill="#fffdf9" stroke="#c0532a" stroke-width="3"/>
  <circle cx="330" cy="175" r="5" fill="#fffdf9" stroke="#c0532a" stroke-width="3"/>
  <circle cx="356" cy="148" r="6" fill="#c0532a"/>

