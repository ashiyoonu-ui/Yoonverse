  <text x="475" y="187" fill="#f4dccf" font-family="monospace" font-size="9" text-anchor="middle">SUBJECT</text>
  <text x="475" y="202" fill="#fffdf9" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Ashiq (India)</text>

  <line x1="526" y1="190" x2="544" y2="190" stroke="#c0532a" stroke-width="2"/>
  <rect x="544" y="173" width="92" height="34" rx="17" fill="#f4dccf" stroke="#c0532a"/>
  <text x="590" y="194" fill="#c0532a" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">architects →</text>
  <line x1="636" y1="190" x2="652" y2="190" stroke="#c0532a" stroke-width="2"/>

  <rect x="652" y="168" width="104" height="44" rx="10" fill="#e3e6d6" stroke="#4f5d3f"/>
  <text x="704" y="187" fill="#4f5d3f" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">OBJECT</text>
  <text x="704" y="202" fill="#1d1b18" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Semantic SEO</text>

  <!-- Triple 2 -->
  <rect x="424" y="232" width="102" height="44" rx="10" fill="#1d1b18"/>
  <text x="475" y="251" fill="#f4dccf" font-family="monospace" font-size="9" text-anchor="middle">SUBJECT</text>
  <text x="475" y="266" fill="#fffdf9" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Topic Clusters</text>

  <line x1="526" y1="254" x2="544" y2="254" stroke="#4f5d3f" stroke-width="2"/>
  <rect x="544" y="237" width="92" height="34" rx="17" fill="#e3e6d6" stroke="#4f5d3f"/>
  <text x="590" y="258" fill="#4f5d3f" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">establish →</text>
  <line x1="636" y1="254" x2="652" y2="254" stroke="#4f5d3f" stroke-width="2"/>

  <rect x="652" y="232" width="104" height="44" rx="10" fill="#f6f1e8" stroke="#1d1b18"/>
  <text x="704" y="251" fill="#7d766b" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">OBJECT</text>
  <text x="704" y="266" fill="#1d1b18" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Domain Authority</text>

  <!-- Triple 3 -->
  <rect x="424" y="296" width="102" height="44" rx="10" fill="#1d1b18"/>
  <text x="475" y="315" fill="#f4dccf" font-family="monospace" font-size="9" text-anchor="middle">SUBJECT</text>
  <text x="475" y="330" fill="#fffdf9" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Visual Entities</text>

  <line x1="526" y1="318" x2="544" y2="318" stroke="#c0532a" stroke-width="2"/>
  <rect x="544" y="301" width="92" height="34" rx="17" fill="#f4dccf" stroke="#c0532a"/>
  <text x="590" y="322" fill="#c0532a" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">validate →</text>
  <line x1="636" y1="318" x2="652" y2="318" stroke="#c0532a" stroke-width="2"/>

  <rect x="652" y="296" width="104" height="44" rx="10" fill="#e3e6d6" stroke="#4f5d3f"/>
  <text x="704" y="315" fill="#4f5d3f" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">OBJECT</text>
  <text x="704" y="330" fill="#1d1b18" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">E-E-A-T Signals</text>

  <!-- Footer Strip in Right Card -->
  <rect x="424" y="354" width="332" height="42" rx="10" fill="#f6f1e8" stroke="#e2d8c8"/>
  <text x="590" y="380" fill="#1d1b18" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">JSON-LD @graph · Wikidata Q180711 · Q668 (India)</text>
