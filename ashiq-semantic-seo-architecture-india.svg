  <text x="58" y="365" fill="#7d766b" font-family="monospace" font-size="10" font-weight="600">SERP POSITION</text>
  <text x="58" y="386" fill="#c0532a" font-family="Georgia, serif" font-size="19" font-weight="700">Rank #1 Snippet</text>

  <rect x="208" y="344" width="152" height="52" rx="10" fill="#e3e6d6" stroke="#cfd5bb"/>
  <text x="222" y="365" fill="#4f5d3f" font-family="monospace" font-size="10" font-weight="700">ENTITY CONFIDENCE</text>
  <text x="222" y="386" fill="#1d1b18" font-family="Georgia, serif" font-size="19" font-weight="700">99.4% Salience</text>

